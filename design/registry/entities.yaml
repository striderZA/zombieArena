# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: bullet_damage
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
      - design/gdd/upgrade-system.md
    variables:
      - hollow_point_stacks
      - weapon_tuning_level
    output_range: [1, 7]
    expression: "1 + hollow_point_stacks + weapon_tuning_level"
    added: 2026-11-21
    revised: ""

  - name: wave_zombie_count
    status: active
    source: design/gdd/wave-system.md
    referenced_by:
      - design/gdd/wave-system.md
    variables:
      - wave
      - coop
    output_range: [5, 128]
    expression: "5 + 2 * (max(1, wave) - 1) + (coop ? 3 + floor(1.5 * max(1, wave)) : 0); if wave >= 5 and wave % 5 == 0: count + 1"
    notes: "Formula is unbounded; live entities are capped at 96 solo / 128 co-op with a spawn queue."
    added: 2026-11-21
    revised: "2026-11-22"

  - name: regular_enemy_health
    status: active
    source: design/gdd/wave-system.md
    referenced_by:
      - design/gdd/wave-system.md
    variables:
      - base_health
      - wave
    output_range: [1, 75]
    expression: "base_health + floor((wave - 1) * (wave - 1) / 12)"
    notes: "Formula is unbounded; 75 is a wave-30 bloater. Elites double the result; the boss uses its own formula. Listed HP is effective HP under the health <= 0 death rule."
    added: 2026-11-22
    revised: "2026-11-22"

  - name: elite_chance
    status: active
    source: design/gdd/wave-system.md
    referenced_by:
      - design/gdd/wave-system.md
    variables:
      - wave
    output_range: [0, 0.25]
    expression: "min(0.05 + 0.015 * wave, 0.25) for wave >= 4"
    notes: "The first non-boss zombie in each wave from wave 4 is always elite."
    added: 2026-11-21
    revised: ""

  - name: boss_health
    status: active
    source: design/gdd/wave-system.md
    referenced_by:
      - design/gdd/wave-system.md
      - design/gdd/combat-system.md
    variables:
      - wave
    output_range: [140, 1280]
    expression: "40 + 18 * wave + 10 * floor((wave - 1) * (wave - 1) / 12)"
    notes: "140 at wave 5, 280 at wave 10, 700 at wave 20, 1280 at wave 30; quadratic term frozen after wave 30, +30/wave thereafter. Two phase gates at 60%/30% HP (2.0 s invulnerable, 2 adds); target TTK 10-20 s."
    added: 2026-11-21
    revised: "2026-11-22"

  - name: kill_scrap
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/combat-system.md
    variables:
      - scrap_value
      - elite
      - wave
      - boss
    output_range: [1, 175]
    expression: "max(1, round((boss ? 25 + 5 * wave : scrap_value) * (elite ? 3 : 1)))"
    notes: "175 at wave 30; unbounded in endless. Magnet and depth multipliers are applied once by bank_multiplier at FinishRun."
    added: 2026-11-21
    revised: "2026-11-22"

  - name: wave_clear_scrap
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/wave-system.md
    variables:
      - wave
    output_range: [7, 65]
    expression: "max(1, 5 + 2 * wave)"
    notes: "65 at wave 30; unbounded in endless. Magnet and depth multipliers are applied once by bank_multiplier at FinishRun."
    added: 2026-11-21
    revised: "2026-11-22"

  - name: bank_multiplier
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/combat-system.md
    variables:
      - scrap_run
      - waves_cleared
      - scrap_magnet_level
    output_range: [0, 1000000000]
    expression: "round(scrap_run * (1 + 0.2 * scrap_magnet_level) * (1 + 0.03 * min(waves_cleared, 30)))"
    notes: "Applied once at FinishRun; up to 2.0x Magnet and 1.9x depth at wave 30, clamped at 1e9."
    added: 2026-11-22
    revised: "2026-11-22"

  - name: meta_upgrade_cost
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
    variables:
      - level
      - base_cost
      - cost_step
      - max_level
    output_range: [-1, 250]
    expression: "level >= max_level ? -1 : base_cost + cost_step * level"
    added: 2026-11-21
    revised: ""

  - name: salvage_rounds
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/combat-system.md
    variables: [max_hp]
    output_range: [1, 137]
    expression: "max(1, round_half_up(0.75 * max_hp / 7))"
    notes: "max_hp is spawn max HP; waves 1-30. Shotgun uses salvage_shells."
    added: 2026-11-22
    revised: ""

  - name: salvage_shells
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/combat-system.md
    variables: [salvage_rounds]
    output_range: [1, 27]
    expression: "max(1, floor(salvage_rounds * 0.20))"
    notes: "Shotgun only; integer form floor(salvage_rounds / 5)."
    added: 2026-11-22
    revised: ""

  - name: ammo_pickup_value
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/upgrade-system.md
      - design/gdd/combat-system.md
    variables: [scavenger_stacks, ammo_share]
    output_range: [3, 40]
    expression: "round_half_up((16 + 8 * scavenger_stacks) * ammo_share)"
    notes: "Elite token and boss-cache ammo; shares 0.20 / 0.50 / 1.00."
    added: 2026-11-22
    revised: ""

  - name: health_pickup_value
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/upgrade-system.md
    variables: [field_medic_stacks]
    output_range: [50, 125]
    expression: "50 + 25 * field_medic_stacks"
    notes: "Grant is capped by the collector's missing health."
    added: 2026-11-22
    revised: ""

  - name: live_seconds
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/upgrade-system.md
    variables: [stacks]
    output_range: [6.0, 7.8]
    expression: "6 + 0.6 * stacks"
    notes: "Field Medic for health; Scavenger for ammo."
    added: 2026-11-22
    revised: ""

  - name: wait_seconds
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/upgrade-system.md
    variables: [stacks]
    output_range: [4.2, 6.0]
    expression: "max(1, 6 - 0.6 * stacks)"
    notes: "Clamps at 1.0 above 8 stacks."
    added: 2026-11-22
    revised: ""

  - name: wave_round_need
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/wave-system.md
    variables: [hp_i, roster_count]
    output_range: [15, 1695]
    expression: "sum(3 * ceil(hp_i / 21))"
    notes: "Wave-start roster; includes elites and boss; excludes phase adds."
    added: 2026-11-22
    revised: ""

  - name: ambient_ammo_value
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/wave-system.md
    variables: [wave, scavenger_stacks, wave_round_need]
    output_range: [16, 231]
    expression: "wave < 20 ? 16 + 8*S : max(16 + 8*S, round_half_up(0.15 * wave_round_need))"
    notes: "Raw before weapon share; w30 expected 165."
    added: 2026-11-22
    revised: ""

  - name: reserve_cap
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/combat-system.md
    variables: [weapon]
    output_range: [40, 240]
    expression: "weapon == shotgun ? 40 : 240"
    notes: "Rifle and SMG 240; shotgun 40."
    added: 2026-11-22
    revised: ""

  - name: collection_distance
    status: active
    source: design/gdd/pickups.md
    referenced_by:
      - design/gdd/pickups.md
      - design/gdd/combat-system.md
    variables: [player_body_radius, token_radius]
    output_range: [46, 46]
    expression: "20 + 26"
    notes: "Squared threshold 2116 px^2."
    added: 2026-11-22
    revised: ""

